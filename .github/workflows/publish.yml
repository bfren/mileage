name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build image and check registry logins without pushing
        type: boolean
        default: true

env:
  DOTNET_NOLOGO: true                     # Disable the .NET logo in the console output
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true # Disable the .NET first time experience to skip caching NuGet packages and speed up the build
  DOTNET_CLI_TELEMETRY_OPTOUT: true       # Disable sending .NET CLI telemetry to Microsoft

jobs:
  restore-build-publish-push:
    runs-on: ubuntu-latest
    steps:
    -
      name: Prepare - Checkout Code
      uses: actions/checkout@v7
    -
      name: Prepare - Read Version
      uses: bfren/read-file@v2
      with:
        file: ./Version
      id: version
    -
      name: Prepare - Remove Config Files
      run: |
        rm ./apps/WebApp/jeebsconfig*.json
    -
      name: Prepare - Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x
    -
      name: Prepare - Set up QEMU
      uses: docker/setup-qemu-action@v3
    -
      name: Prepare - Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    -
      name: Prepare - Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    -
      name: Prepare - Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    -
      name: Restore
      run: |
        dotnet restore Mileage.slnx
    -
      name: Style
      run: |
        dotnet format style -v d Mileage.slnx \
          --no-restore \
          --verify-no-changes
    -
      name: Build
      run: |
        dotnet build Mileage.slnx \
          --no-restore \
          --configuration Release
    -
      name: Publish
      run: |
        dotnet publish apps/WebApp/WebApp.csproj \
          --configuration Release \
          --runtime linux-musl-x64 \
          --output ./publish \
          --no-self-contained
    -
      name: Push
      id: docker_build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: apps/WebApp/Dockerfile
        push: ${{ !inputs.dry_run }}   # inputs.dry_run is empty on release, so this pushes
        platforms: linux/amd64
        tags: |
          bfren/mileage:latest
          bfren/mileage:${{ steps.version.outputs.contents }}
          ghcr.io/bfren/mileage:latest
          ghcr.io/bfren/mileage:${{ steps.version.outputs.contents }}
  notify:
    needs: restore-build-publish-push
    if: always() && !inputs.dry_run # always(): otherwise this job is skipped when an earlier job fails, and the failure message is never sent
    uses: bfren/dotnet/.github/workflows/notify.yml@main
    with:
      name: Mileage
      results: ${{ toJSON(needs.*.result) }}
      success-message: Docker Image Published
      failure-message: Failed to Publish Docker Image
    secrets: inherit
